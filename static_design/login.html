<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARKSAFE — Admin Login</title>
    <meta name="description" content="Parksafe Admin Authentication Portal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f1f5f9;
            flex-direction: column;
            gap: 0;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }
        .btn-primary { width: 100%; padding: 12px; font-size: 14px; }
        .form-group label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 700; }
        .form-control { padding: 11px 14px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px;">
            <h1 style="font-size:26px;font-weight:900;color:#0f172a;letter-spacing:1px;margin-bottom:4px;">PARKSAFE</h1>
            <p style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;">ADMIN &amp; OPERATOR LOGIN</p>
        </div>

        <form onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group" style="margin-bottom:16px;">
                <label>Username</label>
                <input type="text" id="username" class="form-control" value="operator" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Password</label>
                <input type="password" id="password" class="form-control" value="••••••••" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="font-size:14px;font-weight:800;letter-spacing:0.5px;">
                SIGN IN →
            </button>
        </form>

        <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid #f1f5f9;">
            <p style="font-size:12px;color:#94a3b8;">Standalone Static Web Design Demo</p>
            <a href="dashboard.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none;">Skip to Dashboard →</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
