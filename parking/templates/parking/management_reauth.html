<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARK NEST — Management Access</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=15.0">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f1f5f9; }
        .access-card { width:min(100% - 32px, 400px); padding:36px; background:#fff; border:1px solid #e2e8f0; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.07); }
        .access-card h1 { margin:0 0 8px; font-size:24px; }
        .access-card p { margin:0 0 24px; color:#64748b; font-size:14px; }
    </style>
</head>
<body>
    <main class="access-card">
        <h1>Parking Management</h1>
        <p>Enter your staff username and password to continue.</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="off">
            {% csrf_token %}
            <input type="hidden" name="action" value="management_reauth">
            <div class="form-group"><label for="id_username">Username</label><input id="id_username" name="username" class="form-control" required autofocus></div>
            <div class="form-group"><label for="id_password">Password</label><input id="id_password" name="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary" type="submit" style="width:100%;">Continue →</button>
        </form>
    </main>
</body>
</html>
