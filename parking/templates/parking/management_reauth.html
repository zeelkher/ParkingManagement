<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Staff Verification — PARK NEST</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="PARK NEST Staff Management Verification Portal.">
    <meta name="keywords" content="park nest, staff verification, parking management access">
    <meta name="author" content="PARK NEST">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b1120">

    <!-- Open Graph Meta -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PARK NEST">
    <meta property="og:title" content="Staff Verification — PARK NEST">
    <meta property="og:description" content="PARK NEST Staff Management Verification Portal.">
    {% load static %}
    <meta property="og:image" content="{% static 'images/logo_white_transparent.png' %}">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}?v=3.0">
    <link rel="icon" type="image/png" sizes="64x64" href="{% static 'images/favicon.png' %}?v=3.0">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}?v=3.0">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon.png' %}?v=3.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=25.0">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f1f5f9; }
        .access-card { width:min(100% - 32px, 420px); padding:36px; background:#fff; border:1px solid #e2e8f0; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.07); text-align:center; }
        .access-card h1 { margin:0 0 4px; font-size:22px; font-weight:800; color:#0f172a; }
        .access-card p { margin:0 0 20px; color:#64748b; font-size:13px; }
        .form-group { text-align:left; margin-bottom:16px; }
        .form-group label { display:block; font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
        .form-control { width:100%; box-sizing:border-box; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
    </style>
</head>
<body>
    <main class="access-card">
        <!-- Logo Header -->
        <div style="margin-bottom:20px;">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #2563eb, #1d4ed8); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);">
                <img src="{% static 'images/logo_white_transparent.png' %}" alt="PARK NEST Logo" style="width: 32px; height: 32px; object-fit: contain;">
            </div>
            <h1>Parking Management</h1>
            <p>Enter your staff username and password to continue.</p>
        </div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="off">
            {% csrf_token %}
            <input type="hidden" name="action" value="management_reauth">
            <div class="form-group"><label for="id_username">Username</label><input id="id_username" name="username" class="form-control" required autofocus></div>
            <div class="form-group"><label for="id_password">Password</label><input id="id_password" name="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary" type="submit" style="width:100%;">Continue →</button>
        </form>
    </main>
</body>
</html>
