<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Bookings Paused — PARKSAFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=15.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="public-shell" style="align-items: center; justify-content: center; padding: 20px;">
    <div class="public-card" style="max-width: 500px; text-align: center; padding: 40px 32px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(245, 158, 11, 0.15); color: #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px;">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 8px;">
            Advance Bookings Currently Paused
        </h1>
        <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
            Online slot reservations are temporarily closed by our parking facility management. Drive-in parking at our main entrance remains open based on live bay availability.
        </p>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="{% url 'booking_status' %}" class="btn btn-primary" style="padding: 12px; font-size: 14px;">
                <i class="fa-solid fa-magnifying-glass" style="margin-right: 6px;"></i> Check Existing Booking Status
            </a>
            <a href="{% url 'login' %}" style="color: #64748b; font-size: 12px; text-decoration: none; margin-top: 10px;">
                Operator Login &rarr;
            </a>
        </div>
    </div>
</body>
</html>
