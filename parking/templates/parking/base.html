<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARKSAFE — Smart Parking Management</title>
    <meta name="description" content="Parksafe — Smart Indian Vehicle Parking Management System">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=14.0">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3H5NxgExQGWeBVTLmMSoloQQHfQn0/n4nSR6pAlm1z8ClQMckmwQmf08i0l6qaH8zaWeBIMucEQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="app-view">

        <!-- ══ TOP NAVBAR ══ -->
        <header class="hud-topbar">
            <div class="brand-zone">
                <div class="brand-text">
                    <span class="brand-name" style="font-size:18px;font-weight:800;letter-spacing:1px;">PARKSAFE</span>
                </div>
            </div>

            <nav class="hud-nav-pills">
                <a href="{% url 'dashboard' %}"
                    class="hud-pill {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    DASHBOARD
                </a>
                <a href="{% url 'vehicle_entry' %}"
                    class="hud-pill {% if request.resolver_match.url_name == 'vehicle_entry' %}active{% endif %}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M12 5v14M5 12l7-7 7 7" />
                    </svg>
                    CHECK-IN
                </a>
                <a href="{% url 'vehicle_exit' %}"
                    class="hud-pill {% if request.resolver_match.url_name == 'vehicle_exit' %}active{% endif %}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M12 19V5M5 12l7 7 7-7" />
                    </svg>
                    CHECK-OUT
                </a>
                <a href="{% url 'history' %}"
                    class="hud-pill {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    HISTORY
                </a>
                <a href="{% url 'parking_management' %}" class="hud-pill {% if request.resolver_match.url_name == 'parking_management' %}active{% endif %}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20.3h-3v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.08 15a1.7 1.7 0 0 0-1.55-1H5.4v-3h.13a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06L8.8 5.94l.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.55V4.7h3v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1h.13v3h-.13a1.7 1.7 0 0 0-1.55 1Z" />
                    </svg>
                    PARKING MANAGEMENT
                </a>
            </nav>

            <div class="user-action-zone">
                <a href="{% url 'logout' %}" class="btn-hud-logout">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    LOGOUT
                </a>
            </div>
        </header>

        <!-- ══ MAIN CANVAS ══ -->
        <main class="hud-canvas">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
