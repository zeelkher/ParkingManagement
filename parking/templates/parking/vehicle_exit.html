{% extends 'parking/base.html' %}
{% block content %}

<div class="form-container">
    {% if error %}
    <div class="alert alert-danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
    </div>
    {% endif %}

    <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="form-group">
            <label>Vehicle Number</label>
            <input type="text" name="vehicle_number" id="id_exit_vehicle_number"
                   class="form-control"
                   placeholder="GJ 00 AA 0000"
                   style="text-transform:uppercase;font-family:'JetBrains Mono',monospace;letter-spacing:2px;font-size:20px;font-weight:800;text-align:center;padding:16px;"
                   oninput="this.value=this.value.toUpperCase()"
                   required>
        </div>
        <div class="form-group">
            <label>Exit Date &amp; Time</label>
            {{ form.exit_time }}
            <small class="field-help">{{ form.exit_time.help_text }}</small>
            {% for error in form.exit_time.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
        </div>
        <button type="submit" class="btn btn-primary mt-4" style="width:100%;padding:13px;font-size:14px;">
            ↑ CHECKOUT VEHICLE &amp; GENERATE RECEIPT
        </button>
    </form>
</div>
{% endblock %}
